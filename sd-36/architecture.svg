<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker></defs>
<rect width="1600" height="960" fill="#0b1020"/>
<text x="800" y="52" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">Lamport and vector clocks: ordering events without trusting time</text>
<text x="800" y="84" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="middle">Order, payment and warehouse servers; dots are events, arrows are messages. Each event carries a Lamport number and a vector [O, P, W].</text>
<line x1="180" y1="150" x2="180" y2="600" stroke="#334155" stroke-width="3"/>
<text x="180" y="138" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">Order server</text>
<line x1="500" y1="150" x2="500" y2="600" stroke="#334155" stroke-width="3"/>
<text x="500" y="138" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">Payment server</text>
<line x1="820" y1="150" x2="820" y2="600" stroke="#334155" stroke-width="3"/>
<text x="820" y="138" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">Warehouse server</text>
<line x1="188" y1="194" x2="810" y2="256" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>
<text x="640" y="226" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">pack it</text>
<line x1="188" y1="324" x2="492" y2="416" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>
<text x="330" y="430" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">refund please: 5 / [2,0,0]</text>
<rect x="192" y="168" width="250" height="46" rx="6" fill="#0b1020"/>
<circle cx="180" cy="190" r="9" fill="#fbbf24"/>
<text x="198" y="186" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="start">order placed</text>
<text x="198" y="206" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">L 1   [1, 0, 0]</text>
<rect x="832" y="238" width="250" height="46" rx="6" fill="#0b1020"/>
<circle cx="820" cy="260" r="9" fill="#a78bfa"/>
<text x="838" y="256" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="start">receive 'pack it'</text>
<text x="838" y="276" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">L 2   [1, 0, 1]</text>
<rect x="832" y="338" width="250" height="46" rx="6" fill="#0b1020"/>
<circle cx="820" cy="360" r="9" fill="#a78bfa"/>
<text x="838" y="356" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="start">packing slip printed</text>
<text x="838" y="376" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">L 3   [1, 0, 2]</text>
<rect x="192" y="298" width="250" height="46" rx="6" fill="#0b1020"/>
<circle cx="180" cy="320" r="9" fill="#fbbf24"/>
<text x="198" y="316" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="start">cancel</text>
<text x="198" y="336" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">L 5 (was 4)   [2, 0, 0]</text>
<rect x="512" y="398" width="250" height="46" rx="6" fill="#0b1020"/>
<circle cx="500" cy="420" r="9" fill="#38bdf8"/>
<text x="518" y="416" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="start">receive 'refund'</text>
<text x="518" y="436" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">L 6 (was 2)   [2, 1, 0]</text>
<rect x="512" y="498" width="250" height="46" rx="6" fill="#0b1020"/>
<circle cx="500" cy="520" r="9" fill="#38bdf8"/>
<text x="518" y="516" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="start">refund</text>
<text x="518" y="536" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">L 7   [2, 2, 0]</text>
<rect x="1120" y="130" width="440" height="220" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="1340.0" y="158" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">Rules</text>
<text x="1340.0" y="182" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Lamport: +1 before every event;</text>
<text x="1340.0" y="203" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">send the counter; on receive max(mine, got) + 1</text>
<text x="1340.0" y="224" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Vector: +1 on my own entry;</text>
<text x="1340.0" y="245" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">send the whole vector;</text>
<text x="1340.0" y="266" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">on receive entry-wise max, then +1 own</text>
<text x="1340.0" y="287" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Ties in Lamport: break by server ID</text>
<rect x="1120" y="370" width="440" height="230" rx="12" fill="#14281a" stroke="#4ade80" stroke-width="2"/>
<text x="1340.0" y="398" fill="#86efac" font-size="18" font-weight="600" text-anchor="middle">Compare two vectors</text>
<text x="1340.0" y="422" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">all &lt;= and one &lt;  -&gt;  before</text>
<text x="1340.0" y="443" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">all &gt;= and one &gt;  -&gt;  after</text>
<text x="1340.0" y="464" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">mixed  -&gt;  concurrent</text>
<text x="1340.0" y="485" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">cancel [2,0,0] vs refund [2,2,0]: before</text>
<text x="1340.0" y="506" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">refund [2,2,0] vs slip [1,0,2]: concurrent</text>
<text x="1340.0" y="527" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Lamport 3 &lt; 7 but slip is NOT before refund</text>
<rect x="40" y="640" width="1520" height="140" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="800" y="672" fill="#f8fafc" font-size="19" font-weight="700" text-anchor="middle">Version vectors on the family cart (one entry per replica: Mumbai, London)</text>
<text x="800" y="706" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="middle">start [3, 2]  -&gt;  Kabir in Mumbai + charger [4, 2]   |   Sara in London - headphones [3, 3]</text>
<text x="800" y="734" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">[4, 2] vs [3, 3]: concurrent -&gt; keep both as siblings, merge: charger, no headphones -&gt; [5, 3]</text>
<text x="800" y="760" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="middle">[4, 2] vs [3, 2]: before -&gt; the newer version simply replaces the older one</text>
<rect x="40" y="800" width="1520" height="130" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="800" y="832" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">What fails, and its solution</text>
<text x="800" y="862" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="middle">Logs sorted by wall clock put the refund 2 ms before the cancel -&gt; Lamport or vector clocks order by cause.</text>
<text x="800" y="888" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="middle">Lamport cannot see concurrent writes -&gt; vector clocks / version vectors (Riak siblings, Amazon Dynamo cart).</text>
<text x="800" y="914" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="middle">Vector grows with clients -&gt; one entry per replica, prune old entries (Dynamo: 10), or hybrid logical clocks (CockroachDB, MongoDB).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>