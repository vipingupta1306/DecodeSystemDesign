spring.main.web-application-type=none
logging.level.org.apache.zookeeper=OFF
logging.level.org.apache.curator=OFF

# Production: the 5 ZooKeeper servers, in 3 different racks / zones (majority = 3, survives 2 failures)
# zookeeper.connect=zk1:2181,zk2:2181,zk3:2181,zk4:2181,zk5:2181
# The leader's lease: no contact with a ZooKeeper majority for 10 s -> session expires -> new leader
dispatcher.session-timeout-ms=10000
dispatcher.connection-timeout-ms=3000
dispatcher.leader-path=/dispatch/leader
