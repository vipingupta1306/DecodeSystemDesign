<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker></defs>
<rect width="1600" height="960" fill="#0b1020"/>

<text x="800" y="52" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">Leader election without split brain: ZooKeeper + Curator</text>
<text x="800" y="84" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="middle">Problem: our own &quot;highest ID wins&quot; election. Solution: majority, lease and term from ZooKeeper + Curator LeaderLatch.</text>
<rect x="40" y="120" width="750" height="380" rx="12" fill="#1a1020" stroke="#f87171" stroke-width="2"/>
<text x="60" y="152" fill="#f87171" font-size="20" font-weight="700" text-anchor="start">PROBLEM</text>
<text x="60" y="440" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">A network split gives each side its own leader (split brain).</text>
<text x="60" y="464" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">1,200 orders assigned twice in 90 s.</text>
<text x="60" y="488" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">A returning server takes the crown back again and again.</text>
<rect x="810" y="120" width="750" height="380" rx="12" fill="#0f1f17" stroke="#4ade80" stroke-width="2"/>
<text x="830" y="152" fill="#4ade80" font-size="20" font-weight="700" text-anchor="start">SOLUTION</text>
<text x="830" y="440" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">Only the side with the ZooKeeper majority (3 of 5) has a leader.</text>
<text x="830" y="464" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">Session timeout 10 s = lease; SUSPENDED = stop assigning at once.</text>
<text x="830" y="488" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">Latch number = term; the warehouse rejects an older term.</text>
<circle cx="300.0" cy="195.0" r="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="300.0" y="201.0" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S1</text>
<circle cx="399.8609342109911" cy="267.55321559063054" r="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="399.8609342109911" y="273.55321559063054" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S2</text>
<circle cx="361.71745149070966" cy="384.94678440936946" r="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="361.71745149070966" y="390.94678440936946" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S3</text>
<text x="361.71745149070966" y="350.94678440936946" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">♛ leader</text>
<circle cx="238.28254850929034" cy="384.94678440936946" r="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="238.28254850929034" y="390.94678440936946" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S4</text>
<circle cx="200.13906578900887" cy="267.55321559063054" r="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="200.13906578900887" y="273.55321559063054" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S5</text>
<text x="200.13906578900887" y="233.55321559063054" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">♛ leader</text>
<line x1="240" y1="175" x2="292" y2="410" stroke="#f87171" stroke-width="4" stroke-dasharray="7 6"/>
<text x="560" y="250" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">own election:</text>
<text x="560" y="274" fill="#fecaca" font-size="14" font-weight="400" text-anchor="middle">highest ID I can see</text>
<text x="560" y="310" fill="#fecaca" font-size="14" font-weight="400" text-anchor="middle">split {1,2,3} | {4,5}</text>
<text x="560" y="334" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">= TWO LEADERS</text>
<circle cx="1000.0" cy="195.0" r="26" fill="#14532d" stroke="#334155" stroke-width="2"/>
<text x="1000.0" y="201.0" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S1</text>
<circle cx="1099.8609342109912" cy="267.55321559063054" r="26" fill="#14532d" stroke="#334155" stroke-width="2"/>
<text x="1099.8609342109912" y="273.55321559063054" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S2</text>
<circle cx="1061.7174514907097" cy="384.94678440936946" r="26" fill="#14532d" stroke="#334155" stroke-width="2"/>
<text x="1061.7174514907097" y="390.94678440936946" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S3</text>
<text x="1061.7174514907097" y="350.94678440936946" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">♛ term 8</text>
<circle cx="938.2825485092903" cy="384.94678440936946" r="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="938.2825485092903" y="390.94678440936946" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S4</text>
<circle cx="900.1390657890089" cy="267.55321559063054" r="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="900.1390657890089" y="273.55321559063054" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">S5</text>
<line x1="940" y1="175" x2="992" y2="410" stroke="#f87171" stroke-width="4" stroke-dasharray="7 6"/>
<rect x="1210" y="190" width="320" height="70" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
<text x="1370" y="218" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">ZooKeeper: 5 servers</text>
<text x="1370" y="242" fill="#bbf7d0" font-size="13" font-weight="400" text-anchor="middle">majority 3 picks ONE leader</text>
<rect x="1210" y="290" width="320" height="80" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
<text x="1370" y="318" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Warehouse gate</text>
<text x="1370" y="344" fill="#fbbf24" font-size="13" font-weight="400" text-anchor="middle">term 7 order: REJECTED</text>
<rect x="40" y="520" width="560" height="320" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="56" y="550" fill="#fbbf24" font-size="19" font-weight="700" text-anchor="start">Tools that already solve it</text>
<text x="56" y="578" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">ZooKeeper + Apache Curator: LeaderLatch, LeaderSelector</text>
<text x="56" y="606" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">etcd: election API with leases</text>
<text x="56" y="634" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Consul: sessions + locks</text>
<text x="56" y="662" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Kubernetes: Lease objects</text>
<text x="56" y="690" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Spring Integration: leader initiator</text>
<text x="56" y="718" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Ideas behind them: majority, lease, term / epoch</text>
<rect x="620" y="520" width="940" height="320" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="636" y="550" fill="#4ade80" font-size="19" font-weight="700" text-anchor="start">Best for us: ZooKeeper + Curator LeaderLatch (all on Kubernetes: Lease)</text>
<text x="636" y="578" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">ZooKeeper ensemble: 5 servers in 3 zones (survives 2 failures)</text>
<text x="636" y="606" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">CuratorFrameworkFactory.newClient(zk1..zk5, sessionTimeoutMs 10000, connectionTimeoutMs 3000, retry)</text>
<text x="636" y="634" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">new LeaderLatch(client, &quot;/dispatch/leader&quot;, &quot;server-N&quot;)</text>
<text x="636" y="662" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">isLeader(): start assigning; notLeader(): stop</text>
<text x="636" y="690" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">connection SUSPENDED or LOST: stop assigning immediately</text>
<text x="636" y="718" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">term = latch node number (bigger for every new leader)</text>
<text x="636" y="746" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Warehouse.accept(term, order): reject term lower than highest seen</text>
<text x="636" y="774" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Demo: real 5-server ZooKeeper in-process (curator-test)</text>
<text x="800" y="880" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="middle">Code: sd-38/springboot (mvn spring-boot:run starts a real 5-server ZooKeeper ensemble for the demo)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
