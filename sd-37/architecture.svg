<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker></defs>
<rect width="1600" height="960" fill="#0b1020"/>

<text x="800" y="52" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">Is it dead or just slow? Let Kubernetes probes decide</text>
<text x="800" y="84" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="middle">Problem: our own 3 s timeout. Solution: Kubernetes liveness / readiness probes + Spring Boot Actuator.</text>
<rect x="40" y="120" width="750" height="380" rx="12" fill="#1a1020" stroke="#f87171" stroke-width="2"/>
<text x="60" y="152" fill="#f87171" font-size="20" font-weight="700" text-anchor="start">PROBLEM</text>
<text x="60" y="440" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">Our own fixed 3 s timeout calls a live warehouse DEAD on sale day.</text>
<text x="60" y="464" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">A 30 s timeout leaves 2,100 orders stuck after a real crash.</text>
<text x="60" y="488" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">&quot;Dead&quot; moved ALL its orders, so 2,000 were packed twice.</text>
<rect x="810" y="120" width="750" height="380" rx="12" fill="#0f1f17" stroke="#4ade80" stroke-width="2"/>
<text x="830" y="152" fill="#4ade80" font-size="20" font-weight="700" text-anchor="start">SOLUTION</text>
<text x="830" y="440" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">Readiness fails only after 3 misses in a row (about 6 s): stop NEW orders.</text>
<text x="830" y="464" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">Liveness restarts only after 30 s stuck; a GC pause is fine.</text>
<text x="830" y="488" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">Old orders are never moved by a timeout; Kubernetes routes new ones.</text>
<rect x="70" y="200" width="130" height="52" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
<text x="135.0" y="232" fill="#f8fafc" font-size="16" font-weight="600" text-anchor="middle">order</text>
<rect x="560" y="200" width="130" height="52" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
<text x="625.0" y="232" fill="#f8fafc" font-size="16" font-weight="600" text-anchor="middle">warehouse</text>
<line x1="202" y1="226" x2="558" y2="226" stroke="#f87171" stroke-width="3" stroke-dasharray="7 6"/>
<text x="380" y="214" fill="#f87171" font-size="14" font-weight="400" text-anchor="middle">no signal for 3 s</text>
<text x="625" y="290" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">DEAD? (alive, network busy)</text>
<rect x="560" y="320" width="130" height="52" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
<text x="625.0" y="352" fill="#f8fafc" font-size="16" font-weight="600" text-anchor="middle">Pune</text>
<line x1="200" y1="260" x2="558" y2="345" stroke="#f87171" stroke-width="2.5" marker-end="url(#r)"/>
<text x="380" y="330" fill="#f87171" font-size="14" font-weight="400" text-anchor="middle">2,000 orders moved</text>
<rect x="840" y="190" width="130" height="52" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
<text x="905.0" y="222" fill="#f8fafc" font-size="16" font-weight="600" text-anchor="middle">order</text>
<rect x="1050" y="180" width="150" height="72" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
<text x="1125" y="210" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">K8s Service</text>
<text x="1125" y="236" fill="#bbf7d0" font-size="13" font-weight="400" text-anchor="middle">ready pods only</text>
<line x1="972" y1="216" x2="1048" y2="216" stroke="#4ade80" stroke-width="2.5" marker-end="url(#g)"/>
<rect x="1360" y="170" width="160" height="52" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
<text x="1440.0" y="202" fill="#f8fafc" font-size="16" font-weight="600" text-anchor="middle">warehouse ✓</text>
<rect x="1360" y="260" width="160" height="52" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
<text x="1440.0" y="292" fill="#f8fafc" font-size="16" font-weight="600" text-anchor="middle">Pune ✓</text>
<line x1="1202" y1="205" x2="1358" y2="196" stroke="#4ade80" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="1202" y1="232" x2="1358" y2="286" stroke="#4ade80" stroke-width="2.5" marker-end="url(#g)"/>
<rect x="1080" y="300" width="230" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
<text x="1195" y="326" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">kubelet probes</text>
<text x="1195" y="350" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="middle">readiness 2 s x 3 fails</text>
<text x="1195" y="372" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="middle">liveness 5 s x 6 fails</text>
<rect x="40" y="520" width="560" height="320" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="56" y="550" fill="#fbbf24" font-size="19" font-weight="700" text-anchor="start">Tools that already solve it</text>
<text x="56" y="578" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Kubernetes: liveness, readiness, startup probes</text>
<text x="56" y="606" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Consul: health checks + gossip between agents</text>
<text x="56" y="634" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Akka Cluster: phi detector, threshold 8</text>
<text x="56" y="662" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Cassandra: phi_convict_threshold 8 (built in)</text>
<text x="56" y="690" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Load balancers: interval + unhealthy threshold</text>
<text x="56" y="718" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Ideas behind them: heartbeats, phi accrual, gossip</text>
<rect x="620" y="520" width="940" height="320" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="636" y="550" fill="#4ade80" font-size="19" font-weight="700" text-anchor="start">Best for us: Kubernetes probes + Spring Boot Actuator (VMs: Consul)</text>
<text x="636" y="578" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">management.endpoint.health.probes.enabled=true</text>
<text x="636" y="606" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">liveness group: livenessState only (never the database)</text>
<text x="636" y="634" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">readiness group: readinessState, warehouseQueue, db</text>
<text x="636" y="662" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">readinessProbe: periodSeconds 2, timeoutSeconds 3, failureThreshold 3</text>
<text x="636" y="690" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">livenessProbe: periodSeconds 5, timeoutSeconds 3, failureThreshold 6 (30 s)</text>
<text x="636" y="718" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">startupProbe: periodSeconds 2, failureThreshold 30 (60 s)</text>
<text x="636" y="746" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">WarehouseQueueHealth: over 5,000 pending orders = OUT_OF_SERVICE</text>
<text x="636" y="774" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Consul: interval 2s, timeout 3s, critical-timeout 30s</text>
<text x="800" y="880" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="middle">Code: sd-37/springboot (mvn spring-boot:run), sd-37/k8s/warehouse-deployment.yaml, sd-37/consul/</text>
