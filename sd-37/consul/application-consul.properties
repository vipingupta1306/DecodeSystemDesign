# Video 37: the same idea without Kubernetes (servers on VMs) -> Consul.
# Add dependency org.springframework.cloud:spring-cloud-starter-consul-discovery and run with --spring.profiles.active=consul
spring.application.name=warehouse-service
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.health-check-path=/actuator/health/readiness
spring.cloud.consul.discovery.health-check-interval=2s
spring.cloud.consul.discovery.health-check-timeout=3s
# critical for 30 s -> removed from the service list
spring.cloud.consul.discovery.health-check-critical-timeout=30s
