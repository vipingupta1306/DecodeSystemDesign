server.port=8080

# Liveness + readiness endpoints (on by default inside Kubernetes; switched on here so it also works locally)
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health

# Liveness = only the app itself. Never put the database or other services here,
# or a slow database makes Kubernetes restart every pod.
management.endpoint.health.group.liveness.include=livenessState

# Readiness = what this warehouse needs to take a NEW order: its own state, its queue (and its database in production).
# In production add the datasource indicator:  ...include=readinessState,db,warehouseQueue
management.endpoint.health.group.readiness.include=readinessState,warehouseQueue

# Our own rule: more than this many pending orders -> "do not send me new orders"
warehouse.queue.max-pending=5000
