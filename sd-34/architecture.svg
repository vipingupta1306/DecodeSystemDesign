<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker></defs>
<rect width="1600" height="960" fill="#0b1020"/>
<text x="800" y="52" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">Multi-region active-active: Mumbai and London both take writes</text>
<text x="800" y="84" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="middle">Users reach the nearest region, write to their home region in a few ms, and changes cross the cable in the background.</text>
<rect x="560" y="110" width="480" height="120" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="800.0" y="138" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">Geo-routing</text>
<text x="800.0" y="162" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">GeoDNS + EDNS client subnet (user's real area)</text>
<text x="800.0" y="183" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">or anycast: one IP, BGP picks the nearest region</text>
<text x="800.0" y="204" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">health check fails -&gt; stop returning it; TTL 60 s</text>
<rect x="40" y="280" width="440" height="250" rx="12" fill="#2a2111" stroke="#f59e0b" stroke-width="2"/>
<text x="260.0" y="308" fill="#fbbf24" font-size="18" font-weight="600" text-anchor="middle">Mumbai region</text>
<text x="260.0" y="332" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">users: Aman, Kabir (home: Mumbai)</text>
<text x="260.0" y="353" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">DB accepts writes, commit ~5 ms</text>
<text x="260.0" y="374" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">change log -&gt; replicator ships origin: Mumbai only</text>
<text x="260.0" y="395" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">applier: skips change IDs already applied</text>
<text x="260.0" y="416" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">two zones: payment written to both</text>
<text x="260.0" y="437" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">runs at most 50 % busy (2 regions)</text>
<rect x="1120" y="280" width="440" height="250" rx="12" fill="#1d1633" stroke="#a78bfa" stroke-width="2"/>
<text x="1340.0" y="308" fill="#c4b5fd" font-size="18" font-weight="600" text-anchor="middle">London region</text>
<text x="1340.0" y="332" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">users: Sara (home: London)</text>
<text x="1340.0" y="353" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">DB accepts writes, commit ~5 ms</text>
<text x="1340.0" y="374" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">change log -&gt; replicator ships origin: London only</text>
<text x="1340.0" y="395" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">applier: skips change IDs already applied</text>
<text x="1340.0" y="416" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">two zones: payment written to both</text>
<text x="1340.0" y="437" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">runs at most 50 % busy (2 regions)</text>
<line x1="700" y1="230" x2="330" y2="276" stroke="#fbbf24" stroke-width="2" marker-end="url(#y)"/>
<text x="480" y="245" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Aman, Kabir</text>
<line x1="900" y1="230" x2="1270" y2="276" stroke="#a78bfa" stroke-width="2" marker-end="url(#v)"/>
<text x="1120" y="245" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Sara</text>
<line x1="484" y1="360" x2="1116" y2="360" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>
<text x="800.0" y="350" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">async replication: changes tagged origin + change ID</text>
<line x1="1116" y1="400" x2="484" y2="400" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>
<text x="800.0" y="428" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">undersea cable ~12,000 km: 60 ms one way, 120 ms round trip (physics floor)</text>
<rect x="560" y="450" width="480" height="120" rx="12" fill="#14281a" stroke="#4ade80" stroke-width="2"/>
<text x="800.0" y="478" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">User table (copy in every region)</text>
<text x="800.0" y="502" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Sara: home London;  Kabir: home Mumbai</text>
<text x="800.0" y="523" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Sara travelling in Mumbai: writes forwarded to London</text>
<text x="800.0" y="544" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">move home: pause, drain changes, flip, resume</text>
<rect x="40" y="610" width="1520" height="190" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="800" y="642" fill="#f8fafc" font-size="19" font-weight="700" text-anchor="middle">Data both regions write at once, and its solution</text>
<text x="380" y="675" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Family cart (Sara + Kabir)</text>
<text x="1000" y="675" fill="#fbbf24" font-size="15" font-weight="400" text-anchor="middle">last write wins loses a write -&gt; merge operations: + charger, - headphones</text>
<text x="380" y="700" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Likes / views counters</text>
<text x="1000" y="700" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">one counter per region, total = sum (CRDT)</text>
<text x="380" y="725" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Last units of stock</text>
<text x="1000" y="725" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">single owner: stock quota per region</text>
<text x="380" y="750" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Unique username</text>
<text x="1000" y="750" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">single owner region; signup pays 120 ms once</text>
<text x="380" y="775" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Payment</text>
<text x="1000" y="775" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">only in the user's home region, written to two zones</text>
<rect x="40" y="820" width="1520" height="110" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="800" y="852" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Built-in solutions and the region-down plan</text>
<text x="800" y="882" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="middle">DynamoDB global tables: write in every region, last write wins.   Cassandra LOCAL_QUORUM: confirm inside your own region.</text>
<text x="800" y="908" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="middle">Region down: geo-routing sends its users to the other region; its last unsent changes merge after it returns; 3 regions -&gt; each at most ~66 % busy.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>