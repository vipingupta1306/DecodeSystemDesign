<rect x="1150" y="314" width="90" height="46" rx="8" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1195" y="343" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle"></text>
<text x="1330" y="215" fill="#4ade80" font-size="15" font-weight="700" text-anchor="middle">acks=all,</text>
<text x="1330" y="240" fill="#bbf7d0" font-size="14" font-weight="400" text-anchor="middle">min.insync 2:</text>
<text x="1330" y="262" fill="#bbf7d0" font-size="14" font-weight="400" text-anchor="middle">confirmed after</text>
<text x="1330" y="284" fill="#bbf7d0" font-size="14" font-weight="400" text-anchor="middle">2 copies; new leader</text>
<text x="1330" y="306" fill="#bbf7d0" font-size="14" font-weight="400" text-anchor="middle">only from in-sync (B1)</text>
<rect x="40" y="520" width="560" height="320" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="56" y="550" fill="#fbbf24" font-size="19" font-weight="700" text-anchor="start">Tools that already solve it</text>
<text x="56" y="578" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">etcd, Consul: Raft, small coordination data</text>
<text x="56" y="606" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">ZooKeeper: majority protocol, leader election</text>
<text x="56" y="634" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">CockroachDB, YugabyteDB, TiKV: Raft, full SQL DB</text>
<text x="56" y="662" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Kafka: replicated event log, metadata via KRaft</text>
<text x="56" y="690" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Google Spanner: Paxos, managed database</text>
<text x="56" y="718" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">Ideas behind them: Raft, Paxos (majority + votes)</text>
<rect x="620" y="520" width="940" height="320" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="636" y="550" fill="#4ade80" font-size="19" font-weight="700" text-anchor="start">Best for our order log: Kafka (SQL rows: CockroachDB, small keys: etcd)</text>
<text x="636" y="578" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">topic order-assignments: partitions 6, replication.factor 3</text>
<text x="636" y="606" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">min.insync.replicas = 2</text>
<text x="636" y="634" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">unclean.leader.election.enable = false</text>
<text x="636" y="662" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">producer: acks = all</text>
<text x="636" y="690" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">producer: enable.idempotence = true, delivery.timeout.ms = 120000</text>
<text x="636" y="718" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">reply &quot;confirmed&quot; only after send(...).get() returns the ack</text>
<text x="636" y="746" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">error: NOT confirmed, retry with the same order ID as the key</text>
<text x="636" y="774" fill="#cbd5e1" font-size="15" font-weight="400" text-anchor="start">3 brokers in 3 zones: 1 down = writes go on; 2 down = writes pause, nothing lost</text>
<text x="800" y="880" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="middle">Code: sd-39/springboot (mvn spring-boot:run starts 3 real Kafka brokers for the demo)</text>
