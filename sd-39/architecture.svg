<text x="325" y="343" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">500</text>
<rect x="380" y="314" width="90" height="46" rx="8" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
<text x="425" y="343" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle"></text>
<text x="560" y="215" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">acks=1:</text>
<text x="560" y="240" fill="#fecaca" font-size="14" font-weight="400" text-anchor="middle">&quot;confirmed&quot; on</text>
<text x="560" y="262" fill="#fecaca" font-size="14" font-weight="400" text-anchor="middle">one copy, then</text>
<text x="560" y="284" fill="#fecaca" font-size="14" font-weight="400" text-anchor="middle">B0 crashed:</text>
<text x="560" y="306" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">501 vanished</text>
<text x="840" y="222" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">B0 ♛</text>
<rect x="950" y="190" width="90" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="995" y="219" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">499</text>
