<rect width="1600" height="960" fill="#0b1020"/>

<text x="800" y="52" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">A confirmed write that never vanishes: consensus-backed Kafka</text>
<text x="800" y="84" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="middle">Problem: confirmed after one copy. Solution: Kafka with 3 copies, 2 required, acks=all (Raft / Paxos ideas underneath).</text>
<rect x="40" y="120" width="750" height="380" rx="12" fill="#1a1020" stroke="#f87171" stroke-width="2"/>
<text x="60" y="152" fill="#f87171" font-size="20" font-weight="700" text-anchor="start">PROBLEM</text>
<text x="60" y="440" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">The log leader said &quot;confirmed&quot; after writing only its own copy.</text>
<text x="60" y="464" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">It crashed; a server without order 501 became leader.</text>
<text x="60" y="488" fill="#fecaca" font-size="15" font-weight="400" text-anchor="start">Customer: &quot;confirmed&quot;. Warehouse: no order.</text>
<rect x="810" y="120" width="750" height="380" rx="12" fill="#0f1f17" stroke="#4ade80" stroke-width="2"/>
<text x="830" y="152" fill="#4ade80" font-size="20" font-weight="700" text-anchor="start">SOLUTION</text>
<text x="830" y="440" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">Confirmed only after 2 of 3 copies have it (acks=all, min.insync 2).</text>
<text x="830" y="464" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">Only an in-sync copy can become leader (unclean election off).</text>
<text x="830" y="488" fill="#bbf7d0" font-size="15" font-weight="400" text-anchor="start">No ack? Retry with the same order ID (idempotent producer).</text>
<text x="70" y="222" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">B0 ♛</text>
<rect x="180" y="190" width="90" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="225" y="219" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">499</text>
<rect x="280" y="190" width="90" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="325" y="219" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">500</text>
<rect x="380" y="190" width="90" height="46" rx="8" fill="#1a1020" stroke="#f87171" stroke-width="2" stroke-dasharray="8 6"/>
