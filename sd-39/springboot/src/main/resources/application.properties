spring.main.web-application-type=none
logging.level.root=WARN
logging.level.org.apache.kafka=OFF
logging.level.kafka=OFF
logging.level.org.apache.zookeeper=OFF

# Production: your 3 (or 5) brokers in different zones
# spring.kafka.bootstrap-servers=broker1:9092,broker2:9092,broker3:9092

# SOLUTION, producer side
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# SOLUTION, topic side (also set as broker defaults in production: default.replication.factor=3,
# min.insync.replicas=2, unclean.leader.election.enable=false)
orderlog.topic=order-assignments
orderlog.partitions=6
orderlog.replication-factor=3
orderlog.min-insync-replicas=2
