<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker></defs>
<rect width="1600" height="960" fill="#0b1020"/>
<text x="800" y="52" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">Where a server's time comes from, and how NTP keeps it close</text>
<text x="800" y="84" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="middle">Atomic clocks and GPS at the top, a time server inside the data centre, and every server correcting its own quartz clock.</text>
<rect x="560" y="110" width="480" height="110" rx="12" fill="#14281a" stroke="#4ade80" stroke-width="2"/>
<text x="800.0" y="138" fill="#86efac" font-size="18" font-weight="600" text-anchor="middle">Stratum 0: atomic clocks + GPS</text>
<text x="800.0" y="162" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">the reference time (UTC)</text>
<text x="800.0" y="183" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Spanner: GPS + atomic clocks in every data centre</text>
<rect x="560" y="270" width="480" height="110" rx="12" fill="#111a33" stroke="#38bdf8" stroke-width="2"/>
<text x="800.0" y="298" fill="#7dd3fc" font-size="18" font-weight="600" text-anchor="middle">Stratum 1: data centre time server</text>
<text x="800.0" y="322" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">wired straight to GPS / atomic clock</text>
<text x="800.0" y="343" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">leap second smeared over 24 h (Google, AWS)</text>
<line x1="800" y1="220" x2="800" y2="266" stroke="#4ade80" stroke-width="2" marker-end="url(#g)"/>
<rect x="60" y="450" width="460" height="250" rx="12" fill="#2a2111" stroke="#f59e0b" stroke-width="2"/>
<text x="290.0" y="478" fill="#fbbf24" font-size="18" font-weight="600" text-anchor="middle">Mumbai server (stratum 2)</text>
<text x="290.0" y="502" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">quartz crystal 32,768 / s, drift up to 20 ppm</text>
<text x="290.0" y="523" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">= ~1.7 s per day without correction</text>
<text x="290.0" y="544" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">chrony / ntpd: 4 timestamps, smallest-delay sample</text>
<text x="290.0" y="565" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">asks 4+ servers, drops the outlier</text>
<text x="290.0" y="586" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">slew max 500 ppm (300 ms in ~10 min); step only if big</text>
<text x="290.0" y="607" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">learns the crystal error (e.g. +12 ppm)</text>
<rect x="1080" y="450" width="460" height="250" rx="12" fill="#1d1633" stroke="#a78bfa" stroke-width="2"/>
<text x="1310.0" y="478" fill="#c4b5fd" font-size="18" font-weight="600" text-anchor="middle">London server (stratum 2)</text>
<text x="1310.0" y="502" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">same NTP client, same local time server</text>
<text x="1310.0" y="523" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">offset after sync: &lt; 1 ms in the data centre</text>
<text x="1310.0" y="544" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">internet sync: a few to tens of ms</text>
<text x="1310.0" y="565" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">PTP with hardware timestamps: microseconds</text>
<text x="1310.0" y="586" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">wall clock: date and time (NTP may step it)</text>
<text x="1310.0" y="607" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">monotonic clock: since boot, never jumps</text>
<line x1="700" y1="380" x2="300" y2="446" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/>
<text x="430" y="400" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">NTP request / answer, 1-2 hops</text>
<line x1="900" y1="380" x2="1300" y2="446" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/>
<text x="1170" y="400" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">NTP request / answer, 1-2 hops</text>
<rect x="560" y="450" width="480" height="250" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="478" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">One NTP exchange (Mumbai)</text>
<text x="800.0" y="502" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">t1 = 1000 (Mumbai sends)</text>
<text x="800.0" y="523" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">t2 = 725, t3 = 726 (time server)</text>
<text x="800.0" y="544" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">t4 = 1051 (Mumbai receives)</text>
<text x="800.0" y="565" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">delay = (t4 - t1) - (t3 - t2) = 50 ms</text>
<text x="800.0" y="586" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">offset = ((t2 - t1) + (t3 - t4)) / 2 = -300 ms</text>
<text x="800.0" y="607" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">error &lt;= round trip / 2 if paths are unequal</text>
<rect x="40" y="740" width="1520" height="190" rx="12" fill="#111a33" stroke="#334155" stroke-width="2"/>
<text x="800" y="772" fill="#f8fafc" font-size="19" font-weight="700" text-anchor="middle">What breaks, and its solution</text>
<text x="420" y="805" fill="#fca5a5" font-size="15" font-weight="400" text-anchor="middle">Last write wins trusts a clock 300 ms ahead</text>
<text x="1150" y="805" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">Spanner TrueTime interval + commit wait; CockroachDB max offset 500 ms; or merge, no clock</text>
<text x="420" y="834" fill="#fca5a5" font-size="15" font-weight="400" text-anchor="middle">Duration measured with the wall clock goes negative</text>
<text x="1150" y="834" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">monotonic clock for durations, timeouts, leases (nanoTime, time.monotonic)</text>
<text x="420" y="863" fill="#fca5a5" font-size="15" font-weight="400" text-anchor="middle">Clock jumps back on a step</text>
<text x="1150" y="863" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">slew instead of step; ID generators wait or stop (see Unique IDs)</text>
<text x="420" y="892" fill="#fca5a5" font-size="15" font-weight="400" text-anchor="middle">Leap second repeats 23:59:59 (2012, 2017 outages)</text>
<text x="1150" y="892" fill="#4ade80" font-size="15" font-weight="400" text-anchor="middle">leap smear over 24 h; leap seconds stop by 2035</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>